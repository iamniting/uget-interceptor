<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>uGet Download Interceptor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="card">
    <div class="header">
      <img src="icons/icon48.png" alt="" width="36" height="36">
      <div>
        <h1>uGet Interceptor</h1>
        <p>Send Chrome downloads to uGet</p>
      </div>
    </div>

    <label class="switch-row">
      <span>
        <strong>Intercept downloads</strong>
        <small>Intercept Chrome downloads and open them in uGet</small>
      </span>
      <input id="enabled" type="checkbox" role="switch">
    </label>

    <div class="status-row" aria-live="polite">
      <span id="status-dot" class="status-dot unknown"></span>
      <span id="status-text">Checking connection...</span>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
